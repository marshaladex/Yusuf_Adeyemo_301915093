    volumes: ["db1-data:/data/db"]
  db2:
    image: mongo:8.0
    command: ["mongod", "--replSet", "ur", "--bind_ip_all"]
    volumes: ["db2-data:/data/db"]
  db3:
    image: mongo:8.0
    command: ["mongod", "--replSet", "ur", "--bind_ip_all"]
